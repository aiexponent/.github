# Reusable PyPI publish using trusted publishing (OIDC), replacing four
# near-identical per-repo workflows.
#
# No API token is used or needed. The job requests an OIDC token with
# "id-token: write" and pypa/gh-action-pypi-publish exchanges it for a
# short-lived upload credential. The PyPI project must have a trusted
# publisher configured for this org, this repo, this workflow filename,
# and the environment named by the "environment" input.
#
# The environment name is an input because the environments already
# differ across the estate: riskforge uses "pypi-publish" while the other
# packages use "pypi". A trusted publisher is bound to one environment
# name, so a hardcoded value would lock riskforge out.
#
# WHAT MAKES THIS JOB RED:
#   1. The build fails, or produces no sdist and no wheel. The guard step
#      counts the files in dist/ and fails when the count is zero, so an
#      empty publish can never report success.
#   2. "twine check --strict" rejects the metadata or the long
#      description, which is what breaks the PyPI project page.
#   3. The version already exists on PyPI, or the OIDC exchange is
#      refused because the trusted publisher does not match this repo,
#      workflow filename, and environment. The publish step exits
#      non-zero in both cases.
#   4. skip-existing is deliberately NOT set. A re-publish of an existing
#      version fails loudly rather than passing as a no-op.
# There is no continue-on-error anywhere in this file.

name: python-publish

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          GitHub environment the publish job runs in. Must match the PyPI
          trusted publisher config. riskforge uses pypi-publish.
        required: false
        type: string
        default: pypi
      python-version:
        description: Python version used to build the distribution.
        required: false
        type: string
        default: "3.12"
      package-dir:
        description: Directory holding pyproject.toml, when the package is not at the repo root.
        required: false
        type: string
        default: "."
      repository-url:
        description: Upload endpoint. Point at TestPyPI to rehearse a release.
        required: false
        type: string
        default: https://upload.pypi.org/legacy/

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build sdist and wheel
        working-directory: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Confirm the build produced artifacts
        working-directory: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          sdists=$(find dist -name '*.tar.gz' | wc -l)
          wheels=$(find dist -name '*.whl' | wc -l)
          echo "sdists=${sdists} wheels=${wheels}"
          if [ "${sdists}" -eq 0 ] || [ "${wheels}" -eq 0 ]; then
            echo "expected at least one sdist and one wheel in dist/" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: ${{ inputs.package-dir }}/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # Required for trusted publishing. Without it the OIDC token is
      # never minted and the upload has no credential at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository-url }}
          # skip-existing stays off on purpose. See the header.
          skip-existing: false
          verbose: true
