<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <radialGradient id="bgGlow" cx="75%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#0D5463" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0D5463" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="activeTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99D2DC" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0D5463" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#99D2DC" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .font-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
      .font-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -0.5px; }
      .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 17px; line-height: 26px; }
      .font-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.8px; }
      .font-node { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; }
      .font-node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 9px; }
      .font-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; }
    </style>
  </defs>

  <!-- Background Base & Ambient Glow -->
  <rect width="1200" height="380" rx="16" fill="#FAF7F2"/>
  <rect width="1200" height="380" rx="16" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" fill="none" stroke="url(#topBorder)" stroke-width="1.5"/>

  <!-- Background DAG Graphic (Right Side) -->
  <g opacity="0.9">
    <!-- Connecting Tracks -->
    <path d="M 730 110 L 820 85" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M 730 140 L 820 150" fill="none" stroke="#99D2DC" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M 730 170 L 820 215" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M 730 260 L 820 215" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <path d="M 940 85 L 1000 150" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M 950 150 L 1000 150" fill="none" stroke="#99D2DC" stroke-width="2"/>
    <path d="M 950 215 L 1000 150" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M 1060 185 L 1060 250" fill="none" stroke="#99D2DC" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Data Pulse Dots -->
    <circle cx="775" cy="145" r="3" fill="#0D5463"/>
    <circle cx="975" cy="150" r="3.5" fill="#0D5463"/>
    <circle cx="1060" cy="217" r="3" fill="#0D5463"/>

    <!-- Source Node: AI Pipeline & Code -->
    <rect x="640" y="115" width="105" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="652" y="135" fill="#1E293B" class="font-node">AI Pipeline</text>
    <text x="652" y="150" fill="#64748B" class="font-code">Models &amp; Code</text>

    <!-- Gate 1: LitmusAI (Art. 5) -->
    <rect x="820" y="60" width="125" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="834" cy="84" r="4" fill="#0D5463"/>
    <text x="846" y="79" fill="#1E293B" class="font-node">LitmusAI</text>
    <text x="846" y="93" fill="#64748B" class="font-node-sub">Art. 5 · Prohibited Screener</text>

    <!-- Gate 2: License Compliance Checker (Art. 53) -->
    <rect x="820" y="126" width="130" height="48" rx="8" fill="#FFFFFF" stroke="#0D5463" stroke-width="1.5"/>
    <circle cx="834" cy="150" r="4" fill="#0D5463"/>
    <text x="846" y="145" fill="#1E293B" class="font-node">License Scanner</text>
    <text x="846" y="159" fill="#64748B" class="font-node-sub">Art. 53 · CycloneDX SBOM</text>

    <!-- Gate 3: RAG Benchmarking (Art. 15) -->
    <rect x="820" y="192" width="130" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="834" cy="216" r="4" fill="#0D5463"/>
    <text x="846" y="211" fill="#1E293B" class="font-node">RAG Benchmark</text>
    <text x="846" y="225" fill="#64748B" class="font-node-sub">Art. 15 · Robustness Eval</text>

    <!-- Gate 4: Document Analyser (Annex IV) -->
    <rect x="640" y="235" width="120" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="652" y="254" fill="#1E293B" class="font-node">Doc Analyser</text>
    <text x="652" y="268" fill="#64748B" class="font-node-sub">Annex IV · VLM Parser</text>

    <!-- Central Moat Hub: RiskForge (Art. 9) -->
    <rect x="1000" y="122" width="135" height="56" rx="8" fill="#FFFFFF" stroke="#0D5463" stroke-width="2"/>
    <circle cx="1016" cy="150" r="5" fill="#0D5463"/>
    <text x="1028" y="145" fill="#1E293B" class="font-node" font-weight="700">RiskForge Core</text>
    <text x="1028" y="161" fill="#64748B" class="font-node-sub">Art. 9 Risk File Generator</text>

    <!-- Output: Signed Audit File -->
    <rect x="1000" y="245" width="135" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1014" y="263" fill="#0D5463" class="font-node">Audit Trail · RMF</text>
    <text x="1014" y="277" fill="#64748B" class="font-code">SHA-256 Hash Chained</text>
  </g>

  <!-- Left Column: Branding & Content -->
  <!-- Caret Symbol (Embedded Official Asset) -->
  <image href="data:image/png;base64," x="70" y="46" width="52" height="40"/>

  <!-- Brand Overline -->
  <g transform="translate(136, 70)">
    <text fill="#0D5463" class="font-brand">AIEXPONENT · OPEN SOURCE AI GOVERNANCE</text>
    <circle cx="372" cy="-4" r="3" fill="#0D5463"/>
  </g>

  <!-- Headline -->
  <text x="70" y="145" fill="#0F1419" class="font-head">AI Governance, as Code.</text>

  <!-- Subtitle -->
  <text x="70" y="185" fill="#475569" class="font-sub">Deterministic, audit-ready open-source tools for EU AI Act</text>
  <text x="70" y="212" fill="#475569" class="font-sub">compliance and GPAI transparency — in 30 minutes, not 30 weeks.</text>

  <!-- Metadata Pills -->
  <g transform="translate(70, 260)">
    <!-- Pill 1: Art 5 -->
    <rect x="0" y="0" width="84" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="12" y="18" fill="#0D5463" class="font-pill">ARTICLE 5</text>

    <!-- Pill 2: Art 9 -->
    <rect x="94" y="0" width="84" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="106" y="18" fill="#0D5463" class="font-pill">ARTICLE 9</text>

    <!-- Pill 3: Art 15 -->
    <rect x="188" y="0" width="90" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="200" y="18" fill="#0D5463" class="font-pill">ARTICLE 15</text>

    <!-- Pill 4: Art 53 -->
    <rect x="288" y="0" width="90" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="300" y="18" fill="#0D5463" class="font-pill">ARTICLE 53</text>

    <!-- Pill 5: Apache 2.0 -->
    <rect x="388" y="0" width="102" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="400" y="18" fill="#0D5463" class="font-pill">APACHE 2.0</text>
  </g>
</svg>
